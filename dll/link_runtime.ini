TraceKnife=0
TraceMaxEvents=500

; Piece of Heart and its mixes as 2 x 1 heart pieces in the case (docs/heart-items-case-2026-10-12.md).
; Set 1 together with the case DATs and packs that carry the models (heart data candidate). Not tested in game.
