; Link's howl and knocks down the nearest standing Ganado within EponaRadius mm (native kick). Radius 1000..15000.
Sheik=1
Epona=1
;SheikRadius=6000
;EponaRadius=8000
; OcarinaSongPlayback (18-oct): after a correct song Link keeps playing while the whole song plays (backing + ocarina,
; Bin32/link_ocarina_play_serenity/sheik/epona.wav), world frozen, then the effect. Toggle/stow or damage cut it: no effect.
; Missing or 1 = on, 0 = the 17-oct replay.
;OcarinaSongPlayback=1
; OcarinaPadStyle (Pad=1): n64 (default) = L+R (LB+RB) takes the ocarina out or away, C notes on the RIGHT stick, A note on
; A, B puts it away, the left stick plays nothing; legacy = notes on the left stick (11-oct).
;OcarinaPadStyle=n64
; OoT staff (docs/ocarina-staff-2026-10-12.md, approved 12-oct): Staff=1 draws the note staff with the native
