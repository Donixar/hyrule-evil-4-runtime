;MasterSwordFromCastle=0

; Opt-in game-thread diagnostics for input, sword pose and incoming attack owner.
; This option does not enable damage cancellation or an active parry.
ParryObserve=0

; Two-tier parry, tier 2 "general block" (docs/parry-two-tier-2026-10-12.md). Compiled, not tested in game.
; Any other frontal melee hit inside the same press window is cancelled with sparks and voice, no enemy recoil.
; 0 = off (also when missing); 1 = active (needs ParryActive=1); 2 = observe only (logs would_block, never cancels).
; Grabs, power-0 grab starters, instant kills (9999 / flag 8), explosions, rocks and spit always pass.
ParryGeneralBlock=0
; 1 (default) = bosses are blockable too; 0 = boss producers pass. Per-producer pins stay fail-closed.
ParryGeneralBosses=1
; Block Zealot bolts with a fresh knife press (ParryWindowMs), front/side and pose or draw guard.
; Needs ParryActive=1, ParryGeneralBlock=1 and ParryGeneralThrown=1; exact native pins or disabled.
ParryLineBlock=0
; Direct native melee contacts: same press window, front/side and pose/guard gates.
; Needs active tier 2; Krauser/tree also need ParryGeneralBosses. Exact group pins or off.
; Novistador is reserved but unavailable until deferred native effects have a proven unwind contract.
; 3.2.1: the bolt and every direct route are off until they are checked in game (set 1 to try them).
ParryDirectKrauserKick=0
ParryDirectNovistador=0
ParryDirectBats=0
ParryDirectCart=0
ParryDirectGiantTree=0
; 1 (default) = thrown axes/sickles/scythes are blocked and knocked away (the knife's native deflect); 0 = they hit.
ParryGeneralThrown=1
; Post-parry grace (Donald 12-oct): after a committed parry or a tier-2 block, this many ms of GAME time
; (same at 60 and 165 FPS) in which a second attacker's frontal hit is also blocked (sparks only, same parry).
; Opened only by a successful parry; never by holding/pressing; a grace block never extends it. 0 = off; 0..1000.
ParryGraceMs=200
; Parry press window (bug #3, 24-oct): a fresh knife press stays armed this many ms while the button is held
; (one hit per press; releasing disarms; holding never rearms). Was a fixed 450; Donald's held presses were
; refused at 453..734 ms. 100..1000, else 750.
ParryWindowMs=750

; Combat runtime (docs/combat-runtime-2026-10-12.md). Compiled, not tested in game.
; Only the exact value 1 enables; every key 0 = no new hook, file or adapter. One at a time:
; HitPartObserve logs the hit list of the Ganado picked as target (and of the parry owner);
; MortalDrawObserve logs target/prompt/press decisions and a census of nearby enemies (no action);
; MortalDrawContextual starts Mortal Draw with the action button from the sheath (clip+voice, no damage);
; MortalDrawDamage (needs Contextual) makes the cut a native knife hit, lethal when unaware;
; ParryReaction / ParryRiposte (need ParryActive=1) add Link's recoil layer / a small native hit.
HitPartObserve=0
MortalDrawObserve=0
MortalDrawContextual=0
MortalDrawDamage=0
ParryReaction=0
ParryRiposte=0
; 1000 = one raw native knife hit (100..3000).
ParryRiposteMilli=1000
; No native line-of-sight test is attributed: with 0 nothing qualifies as a target.
; 1 waives the obstacle test (use a short MortalDrawMaxRange). Read only with a Mortal Draw key on.
MortalDrawLineWaiver=0
MortalDrawMaxRange=1200
; Player frames from the start of the clip to the cut (1..33). Provisional.
MortalDrawStrikeTick=16
; Horizontal reach accepted at the cut (300..4000, never below MaxRange): the clip lunges Link.
MortalDrawStrikeRange=2000
; 1 turns Link to face the target when the Mortal Draw starts (yaw only, no translation).
MortalDrawFaceTarget=1
; 1 (default): the contextual Mortal Draw also starts while Link walks, backs up, runs or turns
; (move table pinned at startup, mortal_draw_start_gate.h); 0 = only from standing idle.
MortalDrawFromMove=1
; Precise Mortal Draw magnet (dll/mortal_draw_magnet.h; read only with a Mortal Draw key on).
; 1 (default) turns Link toward the target during the windup and clamps the clip's lunge at the contact distance.
MortalDrawMagnet=1
; Never closer than this to the target centre, horizontal units (200..1500).
MortalDrawContact=600
; Windup turn toward the target, degrees per frame (1..180).
MortalDrawTurnRate=15
; Percent of the clip's sideways drift kept (0..100).
MortalDrawLateralKeep=0
; 1 keeps the clamp after the cut until the action ends.
MortalDrawMagnetFollow=1
; 1 turns the removed drift into progress along the line to the target.
MortalDrawMagnetRedirect=0
; Mortal Draw prompt (docs/mortal-draw-prompt-2026-10-12.md, option a; read only with MortalDrawContextual=1).
; 1 (default) shows "[E] MORTAL DRAW" as a native action prompt with no function, only when no native prompt
; is offered (a kick/door/talk prompt always wins). Needs the core.udas text (message 0x5A); without it the
; native placeholder text shows. Not tested in game.
MortalDrawPrompt=1
; E (default) or Action = the game's own action button (KEY_A in BIO4/input.ini). Another free letter/digit/F-key
; = a dedicated key (text-only prompt, message 0x5B, rebuild the text with that key); keys bound to another
; gameplay action, F1/F2/F5/F6/F8-F11 and mouse buttons are refused (back to Action).
MortalDrawKey=E
; Dedicated key only: XInput button. Not wired yet (logged and ignored).
MortalDrawPadButton=None
; 1 also clears KEY_CK (0x400) on the Mortal Draw frame: E feeds both KEY_A and KEY_CK.
MortalDrawMaskCheck=1

[Ocarina]
; Ocarina of Time, phase 1 (Task 10). Compiled, not tested in game. Only the exact value 1 enables.
; Enabled=0 creates nothing: no hooks, files, audio devices, input reads or item grant.
