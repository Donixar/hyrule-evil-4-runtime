[LinkRuntime]
; Camera-only trial: hold left Ctrl ([ZTarget] Key), V selects a target to the right. All native actions have priority.
; See docs/dll2-camera-shield-eventclock-2026-10-16.md. 0 installs no camera hooks.
ZTarget=0
; Rear shield (experimental): 1 halves a Ganado axe/sickle/hoe/scythe hit from Link's rear 90 degrees at shield height.
RearShield=0
; Share of a qualified rear hit that still reaches Link, 50..100 (default 75; 50 = half).
RearShieldDamagePercent=75
; Separate observation-only transport, no shield sound or health writes. See DLL-2 report.
RearShieldObserve=0
; Offline sword-action candidate (15-oct). Only exact 1 enables. Requires the pinned
; clips/voices and the existing explicit MortalDrawLineWaiver=1. Native actions win.
SpinAttack=0
EndingBlow=0
; Ending Blow leap (16-oct; tested in game on flat ground from 1.7-2.9 m, walls/doors/ledges pending; read only with EndingBlow=1): 0 = in-place jump as
; before, 1 = leap toward the down Ganado, 2 = observe (log the plan, never move Link). Ranges in RE4
; units; out-of-range values keep the default. docs/ending-blow-leap-2026-10-16.md
; Reach (17-oct): 8500 with and without a Z-lock (LeapRange 1200..9000, the Z-lock's hold; FreeRange 1200..LeapRange, 45-degree cone
; without a lock). Height (24-oct): beyond the strike reach the Ganado may lie up to 6000 below Link or 2500 above him
; (Link leaps down slopes, steps and drops, coming down to the Ganado's level instead of hovering; up only where the
; floor carries him; a ledge past the Ganado's level stops the leap); within it 1000 below / 900 above with the leap
; (400 both ways with it off). A Ganado getting up is a target too with the leap on.
;EndingBlowLeap=0
;EndingBlowLeapRange=8500
;EndingBlowLeapFreeRange=8500
;EndingBlowLeapStandoff=900
;EndingBlowStrikeRange=1200
;EndingBlowLeapPreferLock=1
; Burst (17-oct), percent 100..300: the leap waits out the takeoff crouch, starts at burst/100 times its mean
; speed and slows into the landing (200: twice, then half). 100 = the even speed of 16-oct.
;EndingBlowLeapBurst=200
; Camera lift (17-oct, read only with EndingBlow=1), percent 0..120 of the Ending Blow's 2 m jump: the camera rises with
; Link so his head stays in frame and is back to normal for the stab. 0 = off. Observe=1 only logs what it would do.
;EndingBlowCameraLift=85
;EndingBlowCameraLiftObserve=0
; Great Spin (18-oct, read only with SpinAttack=1; docs/combat-gs-sb-01-2026-10-18.md): the spin with full HP reaches
; GreatSpinRadius (mm, 2200..6000), hits at GreatSpinPermille of the knife damage (1000..3000), shows GreatSpinSparkles
; spark bursts (0..16) and plays Bin32/link_great_spin.wav. Missing or 1 = on, 0 = off.
;GreatSpin=1
; Spin and Great Spin break boxes, wooden barrels, vases, cabinets and boards in reach (not the red barrel).
;SpinBreakables=1
; Pilot: Krauser's bow (item 0x52, arrows 0x72) for Link, no art yet. 1 = Leon's weapon table gets wep28 and the
; bow's left hand maps to Leon's; needs the arrow members in Link's archives (scripts/krauser_bow_pilot.py). 0 = off.
;KrauserBowPilot=0
; Spin bullets: free shots all around Link at the spin (SpinBulletsCount, 1..32) and the Great Spin
; (GreatSpinBulletsCount), up to SpinBulletsRange mm (2000..30000), stopped by walls. 0 = off.
;SpinBullets=1
;SpinBulletsCount=8
;GreatSpinBulletsCount=12
;SpinBulletsRange=12000
;GreatSpinRadius=3500
;GreatSpinPermille=2000
;GreatSpinSparkles=8
; Shield Bash (18-oct, read only with SpinAttack=1 or EndingBlow=1, needs ZTarget=1): hold the Z-target key and tap the
; knife button (under 0.25 s): up to ShieldBashTargets (1..4) Ganados in front within ShieldBashReach (mm, 1000..3000)
; take the native kick reaction, and for ShieldBashDeflectMs (0..1000) thrown axes, sickles, scythes and arrows in front
; within ShieldBashDeflectReach (mm, 1000..5000) are knocked away. Plays Bin32/link_shield_bash.wav. Missing or 1 = on.
;ShieldBash=1
;ShieldBashReach=2200
;ShieldBashTargets=3
;ShieldBashDeflectMs=500
;ShieldBashDeflectReach=3000
; spin-fix-01: the kick record never kills (token damage: the knockback only). ShieldBashMotion (missing or 1 = on) plays
; TP's shield attack clip (Bin32/link_shield_bash.fcv/.seq/_voice.wav) and lands the push on its impact frame; 0 = the
; bash fires on the tap with the parry reaction as before.
;ShieldBashMotion=1
; Back Slice (18-oct, needs SpinAttack=1 and ZTarget=1): with a Ganado Z-locked, strafe sideways (A/D or the left stick)
; and tap the knife button: Link circles ~180 degrees round it (BackSliceArcFrames game frames, radius 1 m..BackSliceMaxRadius)
; and slashes its back at BackSlicePermille of the knife damage (1000..3000), past a frontal shield. One per second.
; Missing or 1 = on. Without A/D the tap stays the Shield Bash.
;BackSlice=1
;BackSlicePermille=1500
;BackSliceArcFrames=20
;BackSliceMaxRadius=3000
; backslice-tp-01: BackSliceMotion (missing or 1 = on) plays TP's own Back Slice (Bin32/link_back_slice_right/left.fcv/.seq
; and link_back_slice_voice.wav): the side roll round the Ganado (the arc lasts the roll, 40 frames, on TP's turn curve;
; BackSliceArcFrames is then not used), the twirl jump slash on its back and the landing, with TP's voice and sword swing.
; 0 = the spin clip as before.
;BackSliceMotion=1
; backslice-cam-01 (19-oct): BackSliceCamera (missing or 1 = on) keeps the camera on the Back Slice: the native falling
; camera does not start while TP's roll lays Link on the ground, the camera orbits round Link at the lock camera's own
; offset as he circles the Ganado (eased in and out by a BackSliceCameraMs spring, 30..200, default 40), follows the
; roll down and the twirl jump up (BackSliceCameraLift percent, 0..150, default 100; 0 = orbit only) and eases back to
; the normal camera after the slash. 0 = the native camera as before (no hook for it).
;BackSliceCamera=1
;BackSliceCameraMs=40
;BackSliceCameraLift=100
; sword-hand-01 (19-oct): SwordInHand (missing or 1 = on, needs SpinAttack=1 or EndingBlow=1). A sword action started
; outside the knife routine (Back Slice, Shield Bash, spin / Great Spin, Ending Blow and its leap) shows the Master Sword
; in the right hand and hides the equipped weapon, as the native knife draw does; at the end (or on damage, death, a
; scene) both come back exactly as they were. 0 = the hand keeps the equipped weapon during the action.
;SwordInHand=1
; sword-trail-e1 (20-oct): SwordTrailLog (exact 1, default 0; needs SpinAttack=1 and LogLevel=2). During every spin and
; Great Spin the log gets, each frame, the blade (base and tip in world units, game time in ms) and the camera matrices
; (`sword_trail sample/view` lines, begin and end), for scripts/sword_trail_render.py. Reads only; large log. 0 = nothing.
SwordTrailLog=0
; sword-trail-01 (20-oct, Task 4a): SwordTrail (missing or 1 = on; needs SpinAttack=1). TP's ribbon behind the blade
; during the spin attack and the Great Spin, drawn in the world table 17 (depth-sorted with models and effects, under
; the HUD). SwordTrailMoves: spin, great_spin, back_slice, ending, slash (comma list). SwordTrailLengthMs: game ms of
; trail of both spins, 60..350 (TP ~200). SwordTrailInner: where the ribbon starts on the blade, 0 = hilt .. 0.9.
; SwordTrailColor / SwordTrailGreatColor: RRGGBB; SwordTrailAlpha / SwordTrailGreatAlpha: 0..255 (the Great Spin is red
; and brighter). trail-moves-01 (21-oct): SwordTrailBack* (Back Slice, gold), SwordTrailEnding* (Ending Blow with its
; leap, white) and SwordTrailSlash* (Link's native knife slashes, faint and short): Color RRGGBB, Alpha 0..255, LengthMs
; 60..350 each. Shield Bash: no trail. Invalid values keep their defaults; an unknown move name keeps the default list.
; Log: `sword_trail ready` at startup, `sword_trail stats` and `sword_trail moves` every 5 s while it draws.
; Needs SwordInHand=1: the ribbon follows the Master Sword in Link's hand (identity_fails in the stats otherwise).
; 0 = nothing read, nothing registered.
SwordTrail=1
SwordTrailMoves=spin,great_spin,back_slice,ending,slash
SwordTrailLengthMs=200
SwordTrailInner=0.25
SwordTrailColor=9FD0FF
SwordTrailAlpha=150
SwordTrailGreatColor=FF3A28
SwordTrailGreatAlpha=170
SwordTrailBackColor=FFD24A
SwordTrailBackAlpha=160
SwordTrailBackLengthMs=250
SwordTrailEndingColor=FFFFFF
SwordTrailEndingAlpha=190
SwordTrailEndingLengthMs=300
SwordTrailSlashColor=E8F0FF
SwordTrailSlashAlpha=90
SwordTrailSlashLengthMs=150
; charge-glow-01 (21-oct): SwordCharge (missing or 1 = on; needs SpinAttack=1 and SwordInHand=1). While the spin attack
; charges, TP's light along the blade (alpha 0 -> SwordChargeAlpha, 0..255, over the 1 s charge) and a glint running
; from the hilt to the tip, in SwordTrailColor (SwordTrailGreatColor with full life); at the full charge the glint
; flashes and SwordChargeSound plays Bin32/link_sword_charge.wav (TP's Z2SE_SWORD_POWER_COME); release or cancel fades
; it in 120 ms. Additive, world table 17 (as the trail). Log: `sword_charge ready`, begin/full/end per charge and
; `sword_charge stats` every 5 s. 0 = nothing read, nothing registered, no sound.
SwordCharge=1
SwordChargeAlpha=140
SwordChargeSound=1
; sword-particles-01 (21-oct): SwordParticles (missing or 1 = on; needs SwordTrail=1, whose blade samples it reads, so
; only the moves in SwordTrailMoves make hit and wall particles). TP's own particles with the real Twilight Princess
; values, simulated at 30 Hz on game time (the same at any FPS) and drawn in the world table 17 like the trail: where
; the blade hits a Ganado, TP's hit sparks, rays, star and debris (the normal set on a native knife slash, the critical
; one on the spin, Great Spin, Back Slice and Ending Blow) with a short flash; where it hits a wall, TP's sparks turned
; by the wall's normal (wood chips for the SwordParticlesWoodTypes types; the floor gives none, as TP); at the spin's
; strike, sparkles around Link in the trail colour, a dust ring at his feet and cut grass leaves around the tip's ring.
; SwordParticlesHit, SwordParticlesWall and SwordParticlesSpin (1/0) switch each group. SwordParticlesGain 0.25..4
; (default 1.0) scales the brightness of the glowing ones. SwordParticlesDust RRGGBB (default 8C7A5A) is the dust
; colour. SwordParticlesWoodTypes (sword-particles-02): wall effect types 0..7, comma separated (up to 8, default none),
; taken from the `type=` of the `sword_particles wall attr=... type=...` log lines (RE4's own surface effect type of the
; wall polygon: 1 = metal); the old SwordParticlesWoodAttr is ignored (a log line says so). Log: `sword_particles ready`
; (and its hit_range), one line per hit, wall contact and spin, the first floor contact of a move, and
; `sword_particles hits=...` every 5 s. 0 = nothing read.
SwordParticles=1
SwordParticlesHit=1
SwordParticlesWall=1
SwordParticlesSpin=1
SwordParticlesGain=1.0
; SwordParticlesAmount 0.1..1 (default 0.35): the share of TP's particle counts thrown (1 = all of TP's).
SwordParticlesAmount=0.35
SwordParticlesDust=8C7A5A
;SwordParticlesWoodTypes=
; sword-trail-probe (20-oct, Task 3b): SwordTrailProbe (exact 1, default 0; needs the player dispatch, i.e. any sword
; action, Z-target face, Mortal Draw or the ocarina). Each frame two static test quads 60 x 180 cm stand 1.5 m in front
; of Link facing the camera: red in the world table 17 (depth-sorted with the world effects and models), blue 70 cm to
; his right in the after-render table 22 only with SwordTrailProbeOt22 (exact 1, default 0: OT22 runs after the frame's
; draw-done, kept apart so a fault there is attributable). SwordTrailProbeRestore (default 1; 0 = debug, the prior GX
; state is not re-issued). Visual check of the sword trail route only; `sword_trail_probe` lines every 5 s.
; 0 = nothing registered.
;SwordTrailProbe=0
;SwordTrailProbeOt22=0
;SwordTrailProbeRestore=1
; Boss music duck (18-oct, docs/dll-music-eventclock-01-2026-10-18.md): while a boss stream plays (bio4bgm cues 04 Del
; Lago, 05 El Gigante, 06 Mendez, 23 Verdugo, 26 Salazar) the room's zone MIDI blocks fade to volume 1 with the game's
; SndRoomBgmVolSet and come back when it stops. Blocks already quiet (r10b FSE, events) are left alone. Only exact 1.
;BossMusicDuck=0
; Combat music duck (18-oct, village r103): same fade (to 1 over 0.5 s, back over 2 s) while a Zelda combat stream
; plays: the 20 cues tp-zone-music-02 points at Hidden Village (07 08 0A 0B 0C 0D 0F 10 11 13 17 1B 25 27 28 29 2D 2F
; 30 3B) and the village cue 02. Shares the boss duck's hook and claims (restored once neither stream is left); works
; with or without BossMusicDuck. Log: combat_music duck/restore. Only exact 1; missing = off.
;CombatMusicDuck=0
; Shield guard (shield-guard-01, docs/shield-guard-01-2026-10-18.md): while the Z-lock is on (Ctrl held / pad R3)
; and the knife is not held, Link holds TP's shield guard (upper-body layer, legs native) with the shield on his left
; arm (body variant). Frontal hits (60 degrees either side) of the producers tier 2 blocks are cancelled: 0 damage,
; sparks, wood/metal sound, a short recoil. Each block costs 1 of ShieldGuardBlocks (1..99); at 0 the shield breaks
; (hidden, break sound, no frontal block and no rear shield) for ShieldRegenSeconds (1..600) of game time and comes
; back on the back with a chime. Needs ZTarget=1 and ParryGeneralBlock. Only exact 1; missing = off.
;ShieldGuard=0
;ShieldGuardBlocks=5
;ShieldRegenSeconds=45
; Event sheath (18-oct, docs/dll-sheath-events-01-2026-10-18.md): in an event, while the event knife evm7700 (the
; Master Sword in Link's hand) is drawn, the event Link's part pl000d (pl00_005, the sword in its sheath) is hidden;
; the empty sheath and the shield (pl00_000) stay. Gameplay and events without evm7700 are untouched. Only exact 1.
;EventSheathHide=0
; The DLL forwards DirectInput8Create even if this is off or the game is unsupported.
; A missing config defaults all features to off. Optional heart capacity is disabled until native QA.
SwordSheath=1
PollMs=5
; Bin32/link_runtime.log detail: 0 = no log file, 1 = startup, errors and feature events (default),
; 2 = also the periodic stats and the parry/shield/Mortal Draw observer samples (large). A log over
; 16 MB at startup is kept as link_runtime.old.log (replacing the previous one) and a fresh one starts.
; Missing or invalid = 1. Logged paths are file names only.
LogLevel=1
; Crash diagnostics: on an access violation at a null address or inside winmm.dll / bio4.exe / XAudio2_7.dll code, write ONE
; Bin32/link_crash_<tick>.dmp and log the registers (docs/re4fps-slots-2026-10-17.md). 0 = off.
CrashDump=1
; gigante-tree-guard-01 (19-oct): GiganteTreeGuard (missing or 1 = on). El Gigante's tree attack (em2b r1 routine
; 0x0E) uses the held tree pointer [em+0x908] without a null check; on 19-oct it was 0 when the release timer fired and
; the game closed (bio4+0x57254F). With the guard a null tree skips the release (and the hp block at 0xBB6D9) as the
; native code would after a release; a non-null tree runs the native instructions unchanged. Every skip logs
; `gigante_tree_guard skip` plus the watcher's context; LogLevel=2 also logs when the tree disappears between frames.
; 0 = the native code, nothing written. Pins differ = nothing written (logged).
;GiganteTreeGuard=1
; gigante-grab-once-01 (19-oct): GiganteGrabOnce (missing or 1 = on). El Gigante's grab (em2b routine 0xB5B40 state 9)
; hits Link (800, x1.5 at rank 10) on EVERY logic tick while its motion frame is inside (86.7, 87.3): one tick at 30 FPS,
; 3-4 at 165 FPS, which kills Link from full life. With the switch a repeat tick of the same window skips the whole hit
; (damage, voice, sound), so the grab hits once at any framerate. Every hit logs `grab_once hit site=gigante` and every
; skipped repeat `grab_once skip site=gigante`. 0 = the native code, nothing written. Pins differ = nothing written (logged).
;GiganteGrabOnce=1
; em38-hit-once-01 (20-oct): SalazarGrabOnce (missing or 1 = on). Salazar's boss form (em38, r228): when a tentacle
; grabs Link, the player routine 0x137480 hits him (550) on EVERY logic tick while his motion frame is inside
; (87.7, 88.3): one tick at 30 FPS, 3-4 at 165 FPS. Same rule as GiganteGrabOnce (dll/grab_hit_once.h): a repeat tick of
; the same window skips the whole hit (damage, voice, sound, vibration). Both log `grab_once hit|skip site=...`.
; 0 = the native code, nothing written. Pins differ = nothing written (logged).
;SalazarGrabOnce=1
; plaga-parasite-once-01 (20-oct): PlagaParasiteOnce (missing or 1 = on). When a Ganado's head bursts into a Plaga,
; its countdown (em+0x74C) calls em10SetParasite on two ticks at 165 FPS (once at 30/60): the first Plaga is orphaned
; and squelches (SE 0x10) forever where the dead Ganado lies. With the switch the countdown ends at 0.0 after the call,
; as at 30/60 FPS: one Plaga. Every burst logs `plaga_once fired ... refire_blocked=1|0`. 0 = the native code, nothing
; written. Pins differ = nothing written (logged).
;PlagaParasiteOnce=1
; 20-oct: once-per-window damage for Saddler's two grabs (all pins for both sites or neither), and Ganado neck grab.
; Missing or 1 = on; 0 = native repeated damage. Every actual hit or skipped repeat logs.
;SaddlerGrabOnce=1
;GanadoNeckGrabOnce=1
; Consume the Garrador/flail chain-rattle timer after its native sound request, avoiding a second trigger at high FPS.
;ChainSoundOnce=1
; Local em3f attack timer: trigger on crossing zero, instead of exact equality that skips at high FPS.
;Em3fAttackTimerFix=1
; case-key-debounce-01 (21-oct): CaseKeyDebounce (missing or 1 = on). Holding the case key (TAB) while the attache
; case opens made it close and open by itself: the game swaps keyboard binding sets on the way in and out, and the
; held key came back as a new press. With the switch a case-key press passes once; the next one only after the key
; is seen released and CaseKeyDebounceMs of real time (0..1000, default 150) have passed. Every swallowed press logs
; `case_key masked ...` (LogLevel 1). 0 = native input, nothing hooked. Pins differ = nothing hooked (logged).
;CaseKeyDebounce=1
;CaseKeyDebounceMs=150
; Read-only frame-rate probe (re4_fps coexistence): every 5 s the log (LogLevel=2) gets logic ticks per second
; (+0x530C) and simulation speed (sum of deltaTime/30 per real second). Missing key = 1.
FpsProbe=1
; Kick camera fly-away at FPS that are not 30/60/120 (re4_fps 144/150/165/180). 0 = off (native game),
; 1 = snap the native CameraInterpolation instead of overshooting (proposed), 2 = also scale its rate
; by deltaTime. Mode 1 confirmed in game at 165 FPS on 15-oct: docs/live-test-2026-10-15.md.
CameraInterpFix=0

; Enabled in the release after real RE4 health/case/healing and audio QA (2026-10-09).
; Set to 0 to disable. Missing INI still leaves the feature disabled.
; Threshold uses native RE4 HP points. This is not a TP heart-unit conversion.
LowHealth=1
; 20-oct: LowHealth alone ignores the persistent Merchant-visited flag. Actual shop/menu/pause gates stay on.
; Missing or 1 = fixed; 0 = the shared reader's earlier gate.
;LowHealthShopFlagFix=1
LowHealthThreshold=360
LowHealthIntervalMs=4000
LowHealthVolumePercent=35

; Diagnostic only: observes every GetWepDmVal weapon ID (knife 0x10, kick 0x14,
