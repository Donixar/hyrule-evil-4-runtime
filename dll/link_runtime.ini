Enabled=0

[ZTarget]
; Key: hold to lock. LCONTROL (default), RCONTROL, MB_MIDDLE, XBUTTON1, XBUTTON2 or a letter (C was the old key). Alt is refused.
;Key=LCONTROL
; Pad=1 (18-oct): ZTargetPadMode toggle (default) = TAP the pad button to lock, tap again to release (aiming, firing
; or a lost target also release it; the knife, a hit taken and a kick keep it); hold = held to lock. ZTargetPadButton: R3 (default, free in
; RE4's three XInput profiles), LT, LB or L3 (RE4 binds those too: their native action still fires; the log names it).
; While locked the right stick flicked sideways switches target and the left stick sideways strafes.
; Neutral (shield-guard-01): the key held (or the pad latched) with no target keeps a neutral Z-target: camera behind
; Link, he keeps his facing, A/D strafe, the shield guard and the Shield Bash work; no auto-lock until a new press.
; StrafeSpeed: the locked/neutral sidestep as a percent of the native walk step, 100..220 (default 160; 220 ~ run).
;StrafeSpeed=160
;ZTargetPadMode=toggle
;ZTargetPadButton=R3
; Left Ctrl is also a Windows modifier: let go of it before Esc (Ctrl+Esc opens Start, Ctrl+Shift+Esc Task Manager)
; and before other tools' F-key hotkeys (Ctrl+F9 is not F9). In menus left Ctrl is the stock accept key. XBUTTON1 avoids both.
; Requires [LinkRuntime] ZTarget=1. Only the exact string 1 enables either switch.
; Observe runs decisions but passes the original offsets unchanged (writes=0).
Observe=0
; Line of sight (17-oct): a lock needs a clear line from Link's head to the Ganado (the Ganados' own sight test,
; EatMgr hitCheck: walls, columns, doors). Blocked for 0.5 s drops the lock. On unless LOS=0; without its pins no
; lock is taken. DebugLineWaiver=1 skips the test and locks through walls (old diagnostic).
; bug #4 (24-oct): a staggered Ganado's kick prompt no longer drops the lock; with the lock input held, a lock
; suspended by the knife, a hit taken or a kick comes back on the same Ganado (up to 2 s of safe frames without it, then neutral).
LOS=1
DebugLineWaiver=0
; TP cursor (17-oct): red arrow above the locked Ganado's head; Notice=1 also shows TP's yellow arrow over the
; Ganado a press would lock. LockSound=1 plays TP's lock/release sounds (link_ztarget_lock.wav / _unlock.wav).
Notice=1
LockSound=1
; 24-oct: the release sound rang like a loud bell next to the game (Donald); 30 sits under the game mix.
LockSoundVolumePercent=30
; Reticle3D (21-oct), with Reticle=1: 1 draws that cursor as a solid 3D arrowhead in the world (it turns slowly, keeps
; its size on screen and hides behind walls and Ganados) and the 2D arrow is not painted; if the 3D one cannot start
; (needs the player dispatch and the trail's native pins) the 2D arrow stays. 0 = the 2D arrow exactly as before.
Reticle3D=1
; Exponential smoothing time constant, 50..1000 ms. Native game deltaTime, not worker PollMs.
SmoothMs=160

