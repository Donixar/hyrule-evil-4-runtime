; Item grants 0x0D once per load and hooks its Use; Freeze suspends the world (only with Pose=1,
; Freeze without Pose is ignored and logged); Mount puts the
; ocarina in the knife slot; Pose plays the clips; Notes plays the five notes; Pad reads XInput.
Enabled=0
Item=0
Freeze=0
Mount=0
Pose=0
Notes=0
Pad=0
NoteVolumePercent=35
; Letters, digits, Up/Down/Left/Right or 0xNN virtual-key codes. Clashing values keep the defaults.
KeyToggle=O
KeyStow=D
KeyNoteA=A
KeyUp=Up
KeyDown=Down
KeyLeft=Left
KeyRight=Right
; Phase 2 (docs/ocarina-serenity-2026-10-12.md): Serenity=1 lets the save-room song open the save screen
; (needs Enabled=1). SerenityMelody=A (chosen 12-oct): Right Down Left Right Right Down A.
Serenity=1
SerenityMelody=A
; Combat songs (docs/ocarina-canciones-sheik-epona-2026-10-17.md, 17-oct, not tested in game yet; need Enabled=1).
; Sheik=1: Sheik's Theme (OoT opening, Up Right Left Right Down A Down) replays the real theme
; (Bin32/link_ocarina_sheik_theme.wav) and flashes every Ganado within SheikRadius mm (native flash grenade:
