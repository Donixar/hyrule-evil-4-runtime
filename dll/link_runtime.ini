; Only the exact value 1 enables either option; missing/invalid values stay OFF.
ChapterProgression=0
TraceChapter=0
ChapterTraceMaxEvents=100
; Master Sword from the castle (docs/ms-castle-01-2026-10-18.md). With ChapterProgression=1, chapters 3-1..4-4
