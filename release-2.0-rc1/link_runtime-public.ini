; Link in RE4 3.0.4 (private build) - runtime settings for Bin32/dinput8.dll.
; Personal overrides: create Bin32/link_runtime.user.ini with only the sections and keys you want to change.
; Non-empty values there win over this file at startup. The 28 cosmetic SwordTrail*, SwordCharge* and
; SwordParticles* controls reload every second; other settings need a game restart. The updater preserves
; user.ini. F8 opens the optional local development panel only when its separate hotkey daemon is running;
; this public package does not include that panel or daemon. You can always edit user.ini by hand.
; Only the exact value 1 turns a switch on; a missing or invalid value keeps the default shown here.
; Write each value alone on its line: a comment after a value makes it invalid.
; Keys that start with ; are optional, shown with their default value; remove the ; to change one.
[LinkRuntime]
; Bin32/link_runtime.log: 0 = no log, 1 = startup, errors and feature events, 2 = also periodic
; statistics and diagnostic samples (large). A log over 16 MB at startup is kept as
; link_runtime.old.log (replacing the previous one) and a new log starts. Paths are logged as file names.
LogLevel=1
; Crash diagnostics: on an access violation at a null address or inside winmm.dll / bio4.exe code, write ONE
; Bin32/link_crash_<tick>.dmp and log the registers, to help report a crash. 0 = off.
CrashDump=1
; GiganteTreeGuard=1 (new in 3.0.2): stops a crash of the original game when El Gigante attacks with a tree
; it no longer holds. 0 = the game's own code.
GiganteTreeGuard=1
; GiganteGrabOnce=1 (new in 3.0.2): El Gigante's grab hurts Link once, as in the original game at 30 FPS
; (at high frame rates it hit several times and killed him from full life). 0 = the game's own code.
GiganteGrabOnce=1
; SalazarGrabOnce=1 (new in 3.0.2): the same for the tentacle grab of Salazar's final form.
SalazarGrabOnce=1
; PlagaParasiteOnce=1 (new in 3.0.2): a Ganado's head bursts into one Plaga, as in the original game at 30 FPS
; (at high frame rates a second, orphaned one kept making its sound forever). 0 = the game's own code.
PlagaParasiteOnce=1
; 3.0.2: the same one-hit guard for both Saddler grabs and the Ganado neck grab.
SaddlerGrabOnce=1
GanadoNeckGrabOnce=1
; 3.0.2: consume the Garrador/flail chain-rattle countdown once, even with a positive float residue.
ChainSoundOnce=1
; 3.0.2: trigger the em3f attack countdown when it crosses zero, rather than requiring exact equality.
Em3fAttackTimerFix=1

; Z-targeting: hold left Ctrl to put the camera behind Link and lock onto the enemy in view; V = next target.
; See also the [ZTarget] section at the end.
ZTarget=1
; Spin attack: hold the knife key 1 s, then release.
SpinAttack=1
; Great Spin: with full life the spin attack reaches GreatSpinRadius
; (mm, 2200..6000), hits at GreatSpinPermille of the knife damage (1000..3000), shows GreatSpinSparkles
; spark bursts around Link (0..16, 0 = none) and plays Bin32/link_great_spin.wav. Needs SpinAttack=1.
GreatSpin=1
; Spin and Great Spin break boxes, wooden barrels, vases, cabinets and boards in reach (not the red barrel).
SpinBreakables=1
; Pilot: Krauser's bow (item 0x52, arrows 0x72) for Link, no art yet. 1 = Leon's weapon table gets wep28 and the
; bow's left hand maps to Leon's; needs the arrow members in Link's archives (scripts/krauser_bow_pilot.py). 0 = off.
KrauserBowPilot=0
; Spin bullets: free shots all around Link at the spin (SpinBulletsCount, 1..32) and the Great Spin
; (GreatSpinBulletsCount), up to SpinBulletsRange mm (2000..30000), stopped by walls. 0 = off.
SpinBullets=1
SpinBulletsCount=8
GreatSpinBulletsCount=12
SpinBulletsRange=12000
GreatSpinSparkles=8
;GreatSpinRadius=3500
;GreatSpinPermille=2000
; Shield Bash: hold the Z-target key (left Ctrl) and tap the knife key
; (under 0.25 s). Up to ShieldBashTargets (1..4) Ganados in front within ShieldBashReach (mm, 1000..3000)
; take the native kick reaction, and for ShieldBashDeflectMs (0..1000) thrown axes, sickles, scythes and
; arrows in front within ShieldBashDeflectReach (mm, 1000..5000) are knocked away. Plays
; Bin32/link_shield_bash.wav. Needs ZTarget=1 and SpinAttack=1 or EndingBlow=1.
ShieldBash=1
;ShieldBashReach=2200
;ShieldBashTargets=3
;ShieldBashDeflectMs=500
;ShieldBashDeflectReach=3000
; 3.0.1: the Shield Bash never kills (the shoved Ganado only falls back) and Link plays TP's shield push.
; ShieldBashMotion=0 drops the animation (the bash then fires on the tap, as in 3.0.0).
ShieldBashMotion=1
; Shield guard (new in 3.0.1, not yet confirmed in game): while Z-locked with the sword away, Link raises the shield
; in TP's guard; a frontal hit (60 degrees either side) does no damage, with sparks and a wood or metal sound. Each
; block costs 1 of ShieldGuardBlocks (1..99); at 0 the shield breaks and is gone (no frontal or rear shield) until
; it comes back after ShieldRegenSeconds of game time. 0 = no guard.
ShieldGuard=1
ShieldGuardBlocks=5
ShieldRegenSeconds=45
; Back Slice: with a Ganado Z-locked, strafe sideways (A/D or the left stick)
; and tap the knife key: Link circles about 180 degrees round it and slashes its back at BackSlicePermille of the
; knife damage (1000..3000), past a frontal shield. One per second. Without A/D the tap stays the Shield Bash.
; Needs ZTarget=1 and SpinAttack=1.
BackSlice=1
; BackSliceMotion=1: TP's Back Slice animation (side roll round the Ganado, then a jumping twirl slash, with TP's
; voice and sword sounds). 0 = the plain spin-attack slash.
BackSliceMotion=1
; BackSliceCamera=1 (new in 3.0.2): the camera follows the Back Slice instead of freezing during the roll;
; it circles round Link and comes back by itself. 0 = the game's own camera.
BackSliceCamera=1
; SwordInHand=1 (new in 3.0.2): the Master Sword shows in Link's hand during the Back Slice, Shield Bash, spin
; and Ending Blow, and the equipped weapon hides until the move ends. Needs SpinAttack=1 or EndingBlow=1.
SwordInHand=1
; SwordTrail=1 (expanded in 3.0.4): a light blue ribbon follows the sword during the spin attack and a
; red one during the Great Spin (red as in Zelda); gold in the Back Slice, white in the Ending Blow (and its leap) and a
; faint, short one in Link's normal knife slashes. SwordTrailMoves picks the moves (spin, great_spin, back_slice,
; ending, slash), SwordTrailLengthMs the spins' length in ms (60..350; the other moves have their own *LengthMs),
; SwordTrailInner where it starts on the blade (0 = hilt .. 0.9), colours as RRGGBB and alphas 0..255. Invalid values
; keep the defaults. 0 = no trail.
; Needs SwordInHand=1: the ribbon follows the Master Sword in Link's hand.
SwordTrail=1
SwordTrailMoves=spin,great_spin,back_slice,ending,slash
SwordTrailLengthMs=200
SwordTrailInner=0.25
SwordTrailColor=9FD0FF
SwordTrailAlpha=150
SwordTrailGreatColor=FF3A28
SwordTrailGreatAlpha=170
SwordTrailBackColor=FFD24A
SwordTrailBackAlpha=160
SwordTrailBackLengthMs=250
SwordTrailEndingColor=FFFFFF
SwordTrailEndingAlpha=190
SwordTrailEndingLengthMs=300
SwordTrailSlashColor=E8F0FF
SwordTrailSlashAlpha=90
SwordTrailSlashLengthMs=150
; SwordCharge=1 (new in 3.0.4): while the spin attack charges, the blade glows and a glint runs from the hilt to the tip, in the
; trail's colour (red with full life: the Great Spin); at the full charge it flashes and SwordChargeSound plays TP's
; "sword ready" sound. SwordChargeAlpha 0..255 sets its strength. 0 = no glow. Needs SpinAttack=1 and SwordInHand=1.
SwordCharge=1
SwordChargeAlpha=140
SwordChargeSound=1
; SwordParticles=1 (new in 3.0.4): TP hit flashes, rays and debris on enemies; sparks at the actual wall contact;
; spin sparkles, dust and small grass tufts. Needs SwordTrail=1 for blade samples. Each group has its own switch.
; Gain 0.25..4 changes glowing particle brightness; Amount 0.1..1 changes particle counts (1 = TP's full count).
; Public tuning: Gain=1.5, Amount=0.35. Dust is RRGGBB. WoodTypes is an optional comma list of wall effect types
; 0..7 for wood chips. Empty = sparks on all walls; village wood is not reliably marked by the game. Floors
; do not emit wall sparks. One wall burst per move; native slashes use a 120 ms cooldown.
SwordParticles=1
SwordParticlesHit=1
SwordParticlesWall=1
SwordParticlesSpin=1
SwordParticlesGain=1.5
SwordParticlesAmount=0.35
SwordParticlesDust=8C7A5A
SwordParticlesWoodTypes=
; CaseKeyDebounce=1 (new in 3.0.4): holding TAB no longer repeatedly opens and closes the attache case when
; the game switches its keyboard layout. Release the key before opening it again; Ms is the extra real-time
; delay (0..1000 ms, default 150). 0 disables the fix for comparison. Game restart required.
CaseKeyDebounce=1
CaseKeyDebounceMs=150
; Diagnostics only (needs LogLevel=2): the sword's position every frame of a spin attack goes to the log.
;SwordTrailLog=0
; Diagnostics only: two coloured test panels in front of Link (sword trail drawing check).
;SwordTrailProbe=0
;SwordTrailProbeOt22=0
;SwordTrailProbeRestore=1
;BackSlicePermille=1500
;BackSliceArcFrames=20
;BackSliceMaxRadius=3000
; Boss music duck (new in 3.0.0, not yet heard in game): while a boss theme plays (in practice the El Gigante
; fights) the area's Zelda music fades out, and it comes back over 2 s when the boss theme ends. 0 = the area
; music keeps playing under the boss theme.
BossMusicDuck=1
; Combat music duck (new in 3.0.1, not yet heard in game): the same for the Zelda battle themes that play when
; Ganados spot Link. 0 = the area music keeps playing under them.
CombatMusicDuck=1
; Ending Blow: attack a downed enemy.
EndingBlow=1
; Ending Blow leap (experimental): 0 = jump in place, 1 = leap toward the downed enemy,
; 2 = plan only (logged, Link does not move). Tested on flat ground only; walls, doors and ledges are untested.
EndingBlowLeap=1
; Leap reach and spacing in RE4 units. Out-of-range values keep the default.
; Reach 8500 with or without a lock (range 1200..9000, where the lock releases; the free reach never exceeds it). The enemy may lie
; up to 6000 below Link or 2500 above him; Link follows slopes, steps and drops down to it.
;EndingBlowLeapRange=8500
;EndingBlowLeapFreeRange=8500
;EndingBlowLeapStandoff=900
;EndingBlowStrikeRange=1200
;EndingBlowLeapPreferLock=1
; Leap start, percent 100..300: Link waits for the takeoff crouch, starts at this percent of his average
; speed and slows into the landing. 100 = the same speed all the way.
;EndingBlowLeapBurst=200
; Camera during the Ending Blow jump, percent 0..120 of the jump height: the camera rises with Link so his head stays
; in view, and is back to normal for the final stab. 0 = off. Observe=1 only logs what the camera would do.
;EndingBlowCameraLift=85
;EndingBlowCameraLiftObserve=0

; Rear shield: softens a Ganado axe, sickle, hoe or scythe hit that comes
; from Link's rear 120 degrees at the height of the shield on his back, while he stands, walks or runs, with a metal
; sound. Every other hit keeps native damage.
RearShield=1
; Share of that hit that still reaches Link, 50..100 (50 = half, the shield before 22-oct; 100 = no protection).
RearShieldDamagePercent=75
; Diagnostic logging for the rear shield. No effect on the game.
RearShieldObserve=0

; Kick camera fix for frame rates other than 30/60/120 (re4_fps at 144/165 FPS): 0 = native camera,
; 1 = snap the camera interpolation instead of overshooting, 2 = also scale its rate by frame time.
CameraInterpFix=1
; Hides the sword on Link's back while it is drawn and shows it again when sheathed.
SwordSheath=1
; Cutscenes (new in 3.0.1, not yet seen in game): while Link holds the Master Sword in the Krauser knife-fight
; scenes, the second sword in his sheath is hidden. 0 = both swords show.
EventSheathHide=1
; Worker poll interval in ms (1..100).
PollMs=5
; Frame-rate probe for diagnostics (logs ticks per second at LogLevel=2). Missing key = 1.
FpsProbe=0

; Low-health alert sound. Threshold in native RE4 HP points.
LowHealth=1
; 3.0.2: let the low-health alert play after visiting the Merchant (including r11c).
; Actual shop screens, menus, pause and input restrictions still silence it. 0 = the earlier gate.
LowHealthShopFlagFix=1
LowHealthThreshold=360
LowHealthIntervalMs=4000
LowHealthVolumePercent=35

; Diagnostic only: logs every weapon damage call, never changes the damage.
TraceKnife=0
TraceMaxEvents=500

; Piece of Heart and its mixes as 2 x 1 heart pieces in the attache case.
CaseHeartItems=1

; Chapter progression of the campaign. TraceChapter logs every chapter event (diagnostic).
ChapterProgression=1
TraceChapter=0
ChapterTraceMaxEvents=100
; Master Sword from the castle (new in 3.0.1, not yet tested in game): from chapter 3-1 to 4-4 Link wears the green
; tunic with the Master Sword and the Hylian shield; the Magic Armor still arrives in 5-1. 0 = Ordon sword until 4-4.
MasterSwordFromCastle=1

; Shield observer samples for diagnostics (logged at LogLevel=2). The parry and the rear shield
; install the shield hooks by themselves.
ShieldObserve=0
ShieldPreClampObserve=0
ShieldTraceMaxEvents=1
ShieldPoseMaxEvents=1
ShieldPoseIntervalMs=5000

; Parry: press the knife key just before a melee hit lands in front of Link to block it.
; ParryObserve only adds diagnostic logging (no effect while ParryActive=1).
ParryObserve=0
ParryActive=1
; Second tier: any other frontal melee hit in the same press window is blocked with sparks.
; 0 = off, 1 = on, 2 = log only. Grabs, instant kills, explosions, rocks and spit always pass.
ParryGeneralBlock=1
; 1 = bosses can be blocked too; 0 = boss attacks pass.
ParryGeneralBosses=1
; 1 = thrown axes, sickles and scythes are blocked and knocked away; 0 = they hit.
;ParryGeneralThrown=1
; After a successful parry, ms of game time in which a second attacker's frontal hit is also blocked (0..1000; 0 = off).
ParryGraceMs=200
; How long one knife press stays ready to parry, in ms (100..1000; 750 if missing). 3.1.0: 750, was 450.
ParryWindowMs=750

; Mortal Draw and parry follow-ups. HitPartObserve and MortalDrawObserve are diagnostic logging only.
HitPartObserve=0
MortalDrawObserve=0
; Mortal Draw: with the sword sheathed, the action button starts it against a nearby enemy.
MortalDrawContextual=1
; The Mortal Draw cut is a native knife hit, lethal on an unaware enemy (needs MortalDrawContextual=1).
MortalDrawDamage=1
; Link's recoil after a parry, and a small counter hit on the parried enemy (need ParryActive=1).
ParryReaction=1
ParryRiposte=1
; Counter hit strength: 1000 = one native knife hit (100..3000).
ParryRiposteMilli=300
; The game has no line-of-sight test the mod can use: with 1, Mortal Draw, the spin attack and
; Ending Blow can pick a target behind an obstacle within MortalDrawMaxRange. With 0 nothing is targeted.
MortalDrawLineWaiver=1
; Target range in RE4 units (300..1200).
MortalDrawMaxRange=1200
; Frames from the start of the Mortal Draw to the cut (1..33).
MortalDrawStrikeTick=16
; Reach accepted at the cut (300..4000, never below MortalDrawMaxRange).
;MortalDrawStrikeRange=2000
; 1 = Link turns to face the target when the Mortal Draw starts (used when the magnet is off).
;MortalDrawFaceTarget=1
; 1 = Mortal Draw also starts while walking, backing up, running or turning; 0 = only standing still.
MortalDrawFromMove=1
; Magnet: turns Link toward the target during the windup and stops the lunge at the contact distance.
;MortalDrawMagnet=1
; Closest distance to the target centre, RE4 units (200..1500).
;MortalDrawContact=600
; Windup turn speed, degrees per frame (1..180).
;MortalDrawTurnRate=15
; Percent of the sideways drift kept (0..100).
;MortalDrawLateralKeep=0
; 1 keeps the contact distance after the cut until the action ends.
;MortalDrawMagnetFollow=1
; 1 turns the removed drift into progress toward the target.
;MortalDrawMagnetRedirect=0
; On-screen prompt for the Mortal Draw, shown only when the game offers no prompt of its own.
MortalDrawPrompt=1
; E or Action = the game's own action button. Another free letter, digit or F-key = a dedicated key (the
; on-screen prompt text is not updated for it). Keys used by another game action, F1/F2/F5/F6/F8-F11 and
; mouse buttons fall back to Action.
MortalDrawKey=E
; Controller button for a dedicated key: not available yet.
MortalDrawPadButton=None
; 1 also clears the check button on the Mortal Draw frame (E is both action and check).
MortalDrawMaskCheck=1

[Ocarina]
; Ocarina of Time: item 0x0D is added once per load; use it from the case or with KeyToggle.
; Each part has its own switch: Item adds the ocarina and its Use, Freeze pauses the world (needs Pose=1),
; Mount puts the ocarina in Link's hand, Pose plays the animation, Notes plays the five notes.
Enabled=1
Item=1
Freeze=1
Mount=1
Pose=1
Notes=1
; Controller (XInput) for the ocarina (experimental, untested with a real controller).
Pad=1
; Controller style: n64 = L+R (LB+RB) take the ocarina out or away, C notes on the right stick, A note on A,
; B puts it away; legacy = notes on the left stick.
OcarinaPadStyle=n64
NoteVolumePercent=35
; Letters, digits, Up/Down/Left/Right or 0xNN virtual-key codes. Clashing values keep the defaults.
KeyToggle=O
KeyStow=D
KeyNoteA=A
KeyUp=Up
KeyDown=Down
KeyLeft=Left
KeyRight=Right
; Serenity: playing the save song opens the save screen when no enemy is near.
; Melody A: Right Down Left Right Right Down A (B is the alternative melody).
Serenity=1
SerenityMelody=A
; Sheik: Sheik's Theme (Up Right Left Right Down A Down) plays the theme and stuns every Ganado near Link
; with a flash. Epona: Epona's Song (Up Left Right Up Left Right) howls and knocks the nearest Ganado down.
; Their reach in mm (1000 to 15000).
Sheik=1
Epona=1
;SheikRadius=6000
;EponaRadius=8000
; Ocarina of Time note staff on screen, and the replay of a recognised song.
Staff=1
; Full song (new in 3.0.1, not yet heard in game): after a correct song Link keeps playing while the whole song
; plays (Bin32/link_ocarina_play_serenity/sheik/epona.wav), then the effect. Taking damage or putting the ocarina
; away cuts it, with no effect. 0 = the short replay of 3.0.0.
OcarinaSongPlayback=1
; Ocarina Manual: Manual=1 (default) lists File_31 as "Ocarina Manual" in
; Files and gives it with the ocarina (needs Item=1 and the ocarina-manual data layer: SS/eng/f31a..d.tpl,
; 3f0031a1..d1.pack, ss_file.dat, core.udas). Manual=0 leaves the Files menu native.
Manual=1

[FairyRevive]
; A fairy (item 0x05) revives Link once from a lethal hit. Instant kills still kill.
Enabled=1
Sound=1
SoundVolumePercent=60

[Rupees]
; Rupee colour by value, Twilight Princess style.
Enabled=1

[ZTarget]
; Key: hold to lock. LCONTROL (default), RCONTROL, MB_MIDDLE, XBUTTON1, XBUTTON2 or a letter (C was the old key). Alt is refused.
;Key=LCONTROL
; Left Ctrl is also a Windows modifier: let go of it before Esc (Ctrl+Esc opens Start, Ctrl+Shift+Esc Task Manager)
; and before other tools' F-key hotkeys (Ctrl+F9 is not F9). In menus left Ctrl is the stock accept key. XBUTTON1 avoids both.
; Controller for Z-targeting (experimental, untested with a real controller). ZTargetPadMode=toggle: tap
; ZTargetPadButton to lock and tap again to release (aiming, firing, damage or a lost target also release it);
; hold = keep it held. ZTargetPadButton: R3 (free in RE4's three controller types), LT, LB or L3 (their native
; action still fires). While locked, the right stick sideways switches target and the left stick sideways strafes.
Pad=1
ZTargetPadMode=toggle
ZTargetPadButton=R3
; With the lock key held and a target locked, A/D circle Link around it. With no Ganado in view the lock is
; neutral: camera behind Link, A/D sidestep, shield guard and Shield Bash still work.
Strafe=1
; Sidestep speed while locked, percent of the walk step (100..220; 220 is about a run).
;StrafeSpeed=160
; Twilight Princess cursor: red arrow above the locked target; Notice=1 adds the yellow arrow over the target a press would lock.
Reticle=1
Notice=1
; Reticle3D=1 (new in 3.0.4): those arrows are solid 3D arrowheads in the world (they turn slowly and hide behind walls);
; 0 = the flat arrows on screen. If the 3D arrow cannot start, the flat one is used. Reticle=0 shows neither.
Reticle3D=1
; TP lock and release sounds.
LockSound=1
; Volume of those sounds, percent (0..100). 3.1.0: 30 (the release sound rang like a bell at 70).
LockSoundVolumePercent=30
; Camera smoothing, 50..1000 ms.
SmoothMs=160
; Line of sight: no lock through walls, columns or doors (the Ganados' own sight test). 0 turns it off.
LOS=1
; Diagnostic: 1 skips the line-of-sight test and locks through walls.
DebugLineWaiver=0
; Diagnostic: 1 runs the decisions without moving the camera.
Observe=0
; Link turns to face the locked target.
FaceTarget=1

[ZeldaLight]
; Zelda's light ray (23-oct): in the playable Ashley/Zelda segment the knife button fires a golden ray at the nearest
; enemy in front (Ganados and awake armor knights). 1 = on, 0 = off.
Enabled=1
; Reach in mm, 2000..30000.
Range=15000
; Time between rays in ms, 100..3000.
CooldownMs=400
; Damage of one ray: Ganados 1..5000 (the game then scales it by difficulty, like the knife), armor knights
; (1000 hp, unscaled) 1..1000.
GanadoDamage=1300
KnightDamage=350
; 1 = log the probe lines (frames, key bits, the non-Ganado enemies of each room).
Probe=0
